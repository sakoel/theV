name: Early V alerts

on:
  schedule:
    # GitHub's scheduler often starts late or skips runs (especially on new repos), so each job has
    # 3 start times. Only one copy runs at a time, and the script exits on its own if it starts too late.
    - cron: "20 12 * * 1-5"   # morning: 8:20 ET summer / 7:20 ET winter
    - cron: "40 12 * * 1-5"   # morning backup
    - cron: "5 13 * * 1-5"    # morning backup
    - cron: "5 19 * * 1-5"    # overnight: 3:05 ET summer / 2:05 ET winter
    - cron: "25 19 * * 1-5"   # overnight backup
    - cron: "45 19 * * 1-5"   # overnight backup
  workflow_dispatch:
    inputs:
      mode:
        description: "test-email, morning, or overnight"
        default: "test-email"

concurrency:
  group: early-v-${{ (contains(github.event.schedule, ' 19 ') || github.event.inputs.mode == 'overnight') && 'overnight' || 'morning' }}
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      EV_EMAIL_FROM: ${{ secrets.EV_EMAIL_FROM }}
      EV_EMAIL_PASSWORD: ${{ secrets.EV_EMAIL_PASSWORD }}
      EV_EMAIL_TO: ${{ secrets.EV_EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - name: Run
        run: |
          MODE="${{ github.event.inputs.mode }}"
          SCHED="${{ github.event.schedule }}"
          if [ "$MODE" = "test-email" ]; then python early_v.py --test-email
          elif [ "$MODE" = "overnight" ] || [[ "$SCHED" == *" 19 "* ]]; then python early_v.py --overnight
          else python early_v.py
          fi
