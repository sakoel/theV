name: Early V alerts

on:
  schedule:
    # GitHub cron is in UTC and often starts 5-20 min late, so jobs start early and the script waits.
    - cron: "30 12 * * 1-5"   # morning run: 8:30 ET in summer / 7:30 ET in winter, script waits for 9:30
    - cron: "15 19 * * 1-5"   # overnight check: 3:15 ET summer / 2:15 ET winter, script waits for 3:50
  workflow_dispatch:           # "Run workflow" button for manual tests
    inputs:
      mode:
        description: "test-email, morning, or overnight"
        default: "test-email"

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      EV_EMAIL_FROM: ${{ secrets.EV_EMAIL_FROM }}
      EV_EMAIL_PASSWORD: ${{ secrets.EV_EMAIL_PASSWORD }}
      EV_EMAIL_TO: ${{ secrets.EV_EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - name: Run
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "test-email" ]; then python early_v.py --test-email
          elif [ "$MODE" = "overnight" ] || [ "${{ github.event.schedule }}" = "15 19 * * 1-5" ]; then python early_v.py --overnight
          else python early_v.py
          fi
